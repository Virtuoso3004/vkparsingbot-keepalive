name: Keep Render awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl --silent --show-error --fail --max-time 20 https://vkparsingbot.onrender.com/health

      - name: Keep repository active
        if: github.event.schedule == '0 0 * * *'
        run: |
          git clone --quiet "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo
          cd repo
          date -u +%FT%TZ > .last-run
          git config user.name keepalive
          git config user.email keepalive@users.noreply.github.com
          git add .last-run
          git diff --cached --quiet || git commit -m "daily activity"
          git push --quiet
